<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Arboresce — Interactive Fiction Editor
  </title>
  <!-- Styles: theme variables, layout, editor blocks, reader preview, and responsive rules. -->
  <style>
   :root {
  --bg:#f4f5f7;
  --panel:#fff;
  --ink:#20242b;
  --muted:#707782;
  --line:#d9dde3;
  --accent:#355f9e;
  --accent2:#e8eef8;
  --soft:#f0f1f3;
  --choice-border:#858b94;
  --choice-fill:transparent;
  --alt-border:#c7cbd2;
  --alt-fill:#f0f1f3;
  --alt-ink:#737985;
  --shadow:0 2px 12px #1620330d
}
body[data-theme=dark] {
  --bg:#17191d;
  --panel:#22252b;
  --ink:#e8eaf0;
  --muted:#a3a9b4;
  --line:#3c414b;
  --accent:#8eafe8;
  --accent2:#303d52;
  --soft:#2a2e35;
  --choice-border:#9299a5;
  --choice-fill:transparent;
  --alt-border:#505661;
  --alt-fill:#2a2e35;
  --alt-ink:#a3a9b4;
  --shadow:0 2px 12px #0005
}
body[data-theme=parchment] {
  --bg:#e9dec4;
  --panel:#f6ecd5;
  --ink:#443522;
  --muted:#86745a;
  --line:#d0bd99;
  --accent:#8a5b2b;
  --accent2:#ead8b5;
  --soft:#eee0c3;
  --choice-border:#9a805f;
  --choice-fill:transparent;
  --alt-border:#cbb894;
  --alt-fill:#eee0c3;
  --alt-ink:#927e62;
  --shadow:0 2px 12px #4b34120d
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif
}
button,input,select,textarea {
  font:inherit;
  color:var(--ink)
}
textarea,.editor {
  color:var(--ink)
}
button {
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--ink);
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer
}
button:hover {
  filter:brightness(.97)
}
button.primary {
  background:var(--accent);
  border-color:var(--accent);
  color:white
}
button.danger {
  color:#c04d4d
}
.topbar {
  min-height:54px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  position:sticky;
  top:0;
  z-index:5;
  flex-wrap:wrap
}
.brand {
  font-weight:800;
  font-size:18px
}
.brand span {
  color:var(--accent)
}
.spacer {
  flex:1
}
.layout {
  display:grid;
  grid-template-columns:250px minmax(330px,1fr) minmax(320px,38%);
  gap:10px;
  padding:10px;
  max-width:2000px;
  margin:auto;
  align-items:start
}
.panel {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:0;
  overflow:hidden
}
.panelhead {
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  font-weight:700;
  display:flex;
  align-items:center;
  gap:7px
}
.panelbody {
  padding:12px
}
.left-col {
  position:sticky;
  top:64px;
  max-height:calc(100vh - 74px);
  display:flex;
  flex-direction:column
}
.left-col .panelbody {
  overflow:auto
}
.side-list {
  display:flex;
  flex-direction:column;
  gap:4px
}
.passage-item {
  width:100%;
  display:flex;
  align-items:center;
  text-align:left;
  padding:8px;
  border-color:transparent;
  background:transparent;
  gap:6px
}
.passage-item.active {
  background:var(--accent2);
  border-color:var(--accent);
  color:var(--ink)
}
.passage-item .name {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1
}
.small {
  font-size:12px;
  color:var(--muted)
}
.field {
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-bottom:10px
}
.field>label,.settings-grid label {
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--muted);
  font-weight:700
}
input[type=text],input[type=number],select,textarea {
  width:100%;
  min-width:0;
  border:1px solid var(--line);
  border-radius:6px;
  padding:7px 8px;
  background:var(--panel);
  color:var(--ink)
}
input[type=color] {
  width:38px;
  height:30px;
  border:1px solid var(--line);
  border-radius:5px;
  padding:2px;
  background:var(--panel)
}
details {
  border:1px solid var(--line);
  border-radius:7px;
  margin:9px 0
}
summary {
  cursor:pointer;
  padding:8px 9px;
  font-weight:400;
  font-size:13px;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px
}
summary::-webkit-details-marker {
  display:none
}
summary::after {
  content:'▾';
  margin-left:auto;
  color:var(--muted);
  font-size:12px
}
details:not([open])>summary::after {
  content:'▸'
}
details>.detail-body {
  padding:9px;
  border-top:1px solid var(--line)
}
.settings-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
.settings-grid .field {
  margin:0
}
.nav-tools {
  margin-bottom:8px
}
.graph {
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:8px 0;
  overflow:visible
}
.graph-level {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:8px;
  flex-wrap:wrap;
  position:relative
}
.graph-node {
  max-width:180px;
  min-width:100px;
  border:1px solid var(--line);
  border-radius:7px;
  padding:8px;
  background:var(--panel);
  color:var(--ink);
  font-size:12px;
  text-align:center;
  white-space:normal;
  overflow-wrap:anywhere
}
.graph-node.active {
  border:2px solid var(--accent);
  background:var(--accent2);
  font-weight:750
}
.graph-node.orphan {
  border-style:dashed
}
.compact-nav {
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 0;
  gap:0
}
.compact-node {
  width:23px;
  height:18px;
  padding:0;
  margin:0;
  border:1px solid var(--muted);
  border-radius:2px;
  background:var(--panel);
  position:relative;
  z-index:1
}
.compact-node.active {
  background:var(--accent);
  border:2px solid var(--accent)
}
.compact-row {
  display:flex;
  justify-content:center;
  gap:12px;
  position:relative;
  padding:0 0 0;
  margin:0
}
.compact-connect {
  height:13px;
  width:2px;
  background:var(--muted);
  margin:0 auto
}
.compact-branches {
  height:12px;
  width:100%;
  border-top:1px solid var(--muted);
  position:relative;
  margin-top:5px
}
.editor-col .panelbody {
  padding:12px
}
.block {
  border:1px solid var(--line);
  border-radius:8px;
  margin:0 0 10px;
  background:var(--panel);
  overflow:hidden
}
.blockhead {
  padding:7px 9px;
  background:var(--soft);
  display:flex;
  align-items:center;
  gap:7px
}
.blockhead strong {
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.04em
}
.blockhead button {
  padding:3px 7px
}
.blockcontent {
  padding:10px
}
.editor {
  min-height:75px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:6px;
  outline:none;
  line-height:1.65;
  color:var(--ink);
  background:var(--panel)
}
.editor:focus {
  border-color:var(--accent)
}
.toolbar {
  display:flex;
  gap:4px;
  margin-bottom:6px;
  flex-wrap:wrap
}
.toolbar button {
  padding:3px 8px;
  font-weight:700
}
.option-row {
  display:grid;
  grid-template-columns:minmax(100px,1fr) minmax(120px,1fr) auto;
  gap:6px;
  align-items:center;
  margin-bottom:7px
}
.option-row input,
.option-row textarea {
  min-width:0
}
.option-row textarea[data-opt-text] {
  width:100%;
  min-height:38px;
  resize:none;
  overflow:hidden;
  line-height:1.45
}
.add-row {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px
}
.hidden {
  display:none!important
}
.preview-col {
  min-width:0
}
.reader-panel {
  display:flex;
  flex-direction:column;
  min-height:350px
}
.reader-scroll {
  padding:22px;
  overflow:auto;
  resize:vertical;
  min-height:350px;
  max-height:80vh;
  height:65vh;
  flex:0 0 auto
}
.reader-title {
  margin:0 0 22px
}
.reader-scroll {
  color:var(--ink);
  background:var(--panel)
}
.reader-text {
  margin:0 0 17px;
  white-space:normal;
  color:var(--ink)
}
.reader-title {
  color:var(--ink)
}
.notes-editor {
  width:100%;
  min-height:50vh;
  resize:vertical;
  border:0;
  border-radius:0;
  background:var(--panel);
  color:var(--ink);
  font:14px/1.6 ui-monospace,monospace;
  padding:14px
}
.preview-tabs {
  display:flex;
  gap:5px
}
.inline-choice {
  display:inline-block;
  max-width:100%;
  border:1.5px solid var(--choice-border);
  background:var(--choice-fill);
  border-radius:5px;
  padding:2px 7px;
  color:inherit;
  cursor:pointer;
  font:inherit;
  font-size:inherit;
  line-height:inherit;
  vertical-align:baseline
}

.option-row input[data-opt-text] {
  font:inherit;
  font-size:inherit;
}
.inline-choice.selected {
  border:1.5px solid var(--choice-border);
  background:var(--choice-fill);
  color:inherit
}
.choice-alternatives {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:3px;
  margin:3px 0 15px 14px;
  padding-left:9px;
  border-left:1px solid var(--line)
}
.choice-alternative {
  max-width:95%;
  border:1px solid var(--alt-border);
  border-radius:5px;
  background:var(--alt-fill);
  color:var(--alt-ink);
  padding:3px 8px;
  cursor:pointer;
  text-align:left
}
.choice-alternative:hover {
  color:var(--ink);
  border-color:var(--accent)
}
.reader-footer {
  padding:9px 12px;
  border-top:1px solid var(--line);
  display:flex;
  gap:5px;
  align-items:center;
  flex-wrap:wrap
}
.toast {
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:#222a36;
  color:white;
  padding:9px 14px;
  border-radius:8px;
  opacity:0;
  pointer-events:none;
  z-index:20
}
.toast.show {
  opacity:1
}
.theme-row {
  display:flex;
  gap:6px;
  align-items:center
}
.theme-row select {
  flex:1
}
.custom-color-row {
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:6px;
  margin-bottom:6px
}
.save-row {
  display:grid;
  grid-template-columns:1fr auto;
  gap:5px
}
.save-row button {
  white-space:nowrap
}
.muted {
  color:var(--muted)
}
@media(max-width:1150px) {
  .layout {
    grid-template-columns:220px minmax(300px,1fr)
  }
  .preview-col {
    grid-column:1/-1
  }
  .left-col {
    position:static;
    max-height:none
  }
  .reader-scroll {
    height:55vh
  }
}
@media(max-width:700px) {
  .layout {
    grid-template-columns:1fr;
    padding:6px
  }
  .left-col {
    order:0
  }
  .editor-col {
    order:1
  }
  .preview-col {
    order:2
  }
  .option-row {
    grid-template-columns:1fr
  }
  .topbar {
    position:static
  }
}
  </style>

// blank so the author can begin writing immediately.

  title: 'Untitled Story',
  start: 'opening',
  passages: [ {
    id: 'opening',       title: 'Opening',       blocks: [ {
      id: uid(),           type: 'text',           html: ''
    }
    ]
  }
  ]
}
;

}

}

}
;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>( {
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

$('loadProject').onchange=async e=> {
  let f=e.target.files[0];
  if(!f)return;
  try {
    let data=JSON.parse(await f.text());
    if(data.story&&Array.isArray(data.story.passages)) {
      story=data.story;
      selectedChoices=data.selectedChoices|| {
      }
      ;
      individualStyles=data.individualStyles|| {
      }
      ;
      collapsedBlocks=data.collapsedBlocks|| {
      }
      ;
      notesText=data.notesText||'';
      $('notesEditor').value=notesText;
      let s=data.settings|| {
      }
      ;
      if(s.theme)$('themeSelect').value=s.theme;
      if(s.customTheme)customTheme=s.customTheme;
      ['readerFont','readerSize','readerLine','globalChoiceStyle','choiceFont','choiceSize','altSize','choiceBorderColor','choiceFillColor','altBorderColor','altFillColor','altTextColor'].forEach(k=> {
        if(s[k]!==undefined)$(k).type==='checkbox'?$(k).checked=s[k]:$(k).value=s[k]
      }
      )
    } else if(data.title&&Array.isArray(data.passages)) {
      story=data;
      selectedChoices= {
      }
      ;
    } else throw Error('invalid');
    currentId=story.start||story.passages[0].id;
    buildCustomTheme();
    themeApply();
    $('choiceGlobalControls').classList.toggle('hidden',!$('globalChoiceStyle').checked);
    $('individualChoiceNotice').classList.toggle('hidden',$('globalChoiceStyle').checked);
    renderAll();
    toast('Project loaded')
  } catch(err) {
    alert('Could not open project JSON.');
  }
  e.target.value=''
}

function exportHtml() {
  const data=JSON.stringify(story).replace(/</g,'\\u003c');
  const st=getStyle();
  const title=esc(story.title||'Untitled Story');
  const css=`body{max-width:780px;margin:45px auto;padding:0 22px;color:#222;background:#fff;font:18px/1.8 Georgia,serif}.title{font-weight:700;font-size:28px;line-height:1.25;margin-bottom:26px}.para{margin:0 0 18px}.picked{display:inline-block;border:1.5px solid ${st.choiceBorder};background:${st.choiceFill==='transparent'?'transparent':st.choiceFill};color:inherit;border-radius:5px;padding:2px 7px;font:inherit;line-height:1.55;cursor:pointer}.alternatives{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin:3px 0 15px 14px;padding-left:9px;border-left:1px solid #ddd}.alt{max-width:95%;border:1px solid ${st.altBorder};border-radius:5px;background:${st.altFill};color:${st.altInk};padding:3px 8px;cursor:pointer;font-size:${st.altSize}px}.alt:hover{filter:brightness(.96)}@media(max-width:600px){body{margin:22px auto}}`;
  const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${title}</title><!-- Styles: theme variables, layout, editor blocks, reader preview, and responsive rules. -->
<style>${css}</style></head><body><h1 class="title" id="title"></h1><main id="story"></main><script>const DATA=${data};let chosen={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const find=id=>DATA.passages.find(p=>p.id===id);function render(){document.getElementById('title').textContent=DATA.title||'Untitled Story';const root=document.getElementById('story');root.innerHTML='';let seen=new Set();function draw(id,d=0){if(d>60||seen.has(id)){const p=document.createElement('p');p.textContent='[Story path stopped: circular passage reference]';root.appendChild(p);return}const pass=find(id);if(!pass)return;seen.add(id);for(const b of pass.blocks){if(b.type==='text'){const p=document.createElement('p');p.className='para';p.style.fontFamily=${JSON.stringify(st.font)};p.style.fontSize=${JSON.stringify(st.size+'px')};p.style.lineHeight=${JSON.stringify(st.line)};p.innerHTML=b.html||'';root.appendChild(p)}else if(b.type==='choice'){let key=chosen[b.id],opt=b.options.find(o=>o.id===key)||b.options[0];if(!opt)continue;chosen[b.id]=opt.id;const picked=document.createElement('button');picked.className='picked';picked.style.fontFamily=${JSON.stringify(st.globalChoice&&st.choiceFont!=='inherit'?st.choiceFont:st.font)};picked.style.fontSize=${JSON.stringify(st.choiceSize+'px')};picked.innerHTML=opt.html||esc(opt.text);picked.onclick=()=>{chosen[b.id]=opt.id;render()};root.appendChild(picked);const alts=document.createElement('div');alts.className='alternatives';b.options.filter(o=>o.id!==opt.id).forEach(o=>{const btn=document.createElement('button');btn.className='alt';btn.style.fontFamily=picked.style.fontFamily;btn.innerHTML=o.html||esc(o.text);btn.onclick=()=>{chosen[b.id]=o.id;render()};alts.appendChild(btn)});if(alts.childElementCount)root.appendChild(alts);draw(opt.target,d+1);return}else if(b.type==='jump'){draw(b.target,d+1);return}}}draw(DATA.start)}render();<\/script></body></html>`;
  download(html,(story.title||'story').replace(/[^a-z0-9-_]+/gi,'_')+'.html','text/html');
  toast('Standalone HTML exported')
}
$('exportBtn').onclick=exportHtml;
function exportRawText() {
  // Export every passage, including all branches, as a readable plain-text plan.
  const lines = [story.title || 'Untitled Story', '='.repeat((story.title || 'Untitled Story').length), ''];
  for (const p of story.passages) {
    lines.push(`# ${p.title}${p.id === story.start ? ' (START)' : ''}`, '');
    for (const b of p.blocks) {
      if (b.type === 'text') {
        const text = (b.html || '')
        .replace(/<\/(p|div|h[1-6])>/gi, '\n')
        .replace(/<br\s*\/?\s*>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
        .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
        lines.push(text, '');
      }  else if (b.type === 'choice') {
        lines.push('Choices:');
        for (const o of b.options) lines.push(`  - ${o.text} → ${passage(o.target)?.title || o.target}`);
        lines.push('');
      }  else if (b.type === 'jump') {
        lines.push(`Passage link: ${passage(b.target)?.title || b.target}`, '');
      }
    }
    lines.push('---', '');
  }
  download(lines.join('\n'), (story.title || 'story').replace(/[^a-z0-9-_]+/gi, '_') + '.txt', 'text/plain;charset=utf-8');
}
$('exportTextBtn').onclick = exportRawText;
buildCustomTheme();
renderAll();
